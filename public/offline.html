<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#635bff" />
    <title>You're offline · Mini Canva AI</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #111827; background: #f5f7fb; }
      main { width: min(100%, 440px); padding: 40px 32px; text-align: center; background: rgba(255,255,255,.92); border: 1px solid #e5e7eb; border-radius: 28px; box-shadow: 0 24px 70px rgba(15,23,42,.12); }
      .logo { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 18px; box-shadow: 0 12px 26px rgba(99,91,255,.25); }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
      p { margin: 12px 0 26px; color: #64748b; line-height: 1.6; }
      button { border: 0; border-radius: 12px; padding: 13px 20px; color: #fff; background: #635bff; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(99,91,255,.22); }
      button:hover { background: #5146e5; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/logo.svg" alt="Mini Canva AI" />
      <h1>You're currently offline</h1>
      <p>Check your internet connection and try again. Mini Canva will reconnect as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
